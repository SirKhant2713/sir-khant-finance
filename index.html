<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sir Khant Finance</title>
<meta name="description" content="နေ့စဉ် သုံးငွေ မှတ်တမ်း — Daily spending tracker for Myanmar.">
<meta name="theme-color" content="#f7f3ea">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sir Khant Finance">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
@font-face{
  font-family:'Noto Sans Myanmar';
  src:url('fonts/NotoSansMyanmar-Regular.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Noto Sans Myanmar';
  src:url('fonts/NotoSansMyanmar-Bold.ttf') format('truetype');
  font-weight:700; font-style:normal; font-display:swap;
}
:root{
  --paper:#f7f3ea; --card:#fffdf6; --ink:#26221a; --ink-soft:#6b6353;
  --line:#e5ddc9; --line-strong:#c9bfa4; --green:#1f4d2e; --green-soft:#e6ecdf;
  --green-ink:#173a22; --green-fill:#2e7d4f; --clay:#B85A30; --warn:#8a5a1d; --warn-bg:#f6ecd8;
  --danger:#9a3226; --input-bg:#ffffff; --chip-bg:#f1ebdb;
  --shadow:0 1px 3px rgba(38,34,26,.07), 0 4px 14px rgba(38,34,26,.05);
  --shadow-lg:0 2px 6px rgba(38,34,26,.08), 0 10px 28px rgba(38,34,26,.09);
  --radius:14px;
}
[data-theme="dark"]{
  --paper:#1d1a15; --card:#27221a; --ink:#ece5d3; --ink-soft:#b3ab95;
  --line:#3d372a; --line-strong:#5d5542; --green:#6fae7e; --green-soft:#26351f;
  --green-ink:#cfe3cf; --green-fill:#5da271; --clay:#D07A4A; --warn:#d9a55c; --warn-bg:#3a2f1c;
  --danger:#e08a7a; --input-bg:#1d1a15; --chip-bg:#332d21;
  --shadow:0 1px 3px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 2px 6px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.3);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Noto Sans Myanmar','Noto Sans',sans-serif;
  font-size:16px; line-height:1.55;
  transition:background-color .45s ease, color .45s ease;
}
#app{max-width:560px; margin:0 auto; padding:14px 16px 110px;}
@keyframes viewEnter{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.view-enter{animation:viewEnter .35s ease both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.fade-up{animation:fadeUp .4s ease both;}
button{font-family:inherit; cursor:pointer; transition:transform .18s ease, background .2s ease, border-color .2s ease, box-shadow .18s ease, color .2s ease;}
button:active{transform:translateY(-2px); box-shadow:0 8px 16px rgba(38,34,26,.18);}
.btn{
  border:1px solid var(--line-strong); background:var(--card); color:var(--ink);
  border-radius:10px; padding:9px 14px; font-size:14.5px; line-height:1.3; box-shadow:var(--shadow);
}
.btn svg{width:17px; height:17px; vertical-align:-3px;}
.btn.primary{background:var(--green); border-color:var(--green); color:#f7f3ea; font-weight:700;}
[data-theme="dark"] .btn.primary{color:#14210f;}
.btn.primary.big{width:100%; padding:14px; font-size:17px; border-radius:12px;}
.btn.danger{color:var(--danger); border-color:var(--danger);}
.btn.ghost{border-color:transparent; background:transparent; box-shadow:none; color:var(--green-ink);}
.btn.small{padding:6px 10px; font-size:13px;}
.iconbtn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  background:var(--card); color:var(--ink-soft); display:inline-flex;
  align-items:center; justify-content:center; box-shadow:var(--shadow); flex-shrink:0;
}
.iconbtn svg{width:20px; height:20px;}
.iconbtn.on{color:var(--green-ink); border-color:var(--green);}
/* ---------- header (user profile) ---------- */
header.top{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 0 14px;}
.profile{display:flex; align-items:center; gap:10px; min-width:0;}
.avatar{width:42px; height:42px; border-radius:50%; border:1px solid var(--line-strong); background:var(--chip-bg); color:var(--ink-soft); overflow:hidden; flex-shrink:0; padding:0; box-shadow:var(--shadow); display:inline-flex; align-items:center; justify-content:center; transition:background-color .45s ease, border-color .45s ease;}
.avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.avatar svg{width:24px; height:24px;}
.pname{font-weight:700; font-size:18px; letter-spacing:.2px; color:var(--green-ink); line-height:1.25; background:none; border:none; padding:4px 2px; text-align:left; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pname-input{font-size:17px; font-weight:700; font-family:inherit; color:var(--ink); background:var(--input-bg); border:1px solid var(--green); border-radius:10px; padding:6px 10px; outline:none; width:150px; transition:background-color .45s ease, color .45s ease;}
.name-ok{width:34px; height:34px; border-radius:50%; border:none; background:var(--green); color:#f7f3ea; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
.name-ok svg{width:18px; height:18px;}
.topbtns{display:flex; gap:8px; flex-shrink:0;}
/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:16px; transition:background-color .45s ease, box-shadow .2s ease, transform .18s ease;}
.card:active{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
.card h3{margin:0 0 12px; font-size:15px; color:var(--green-ink); display:flex; justify-content:space-between; align-items:baseline;}
.card h3 .side{font-weight:400; font-size:13px; color:var(--ink-soft);}
/* ---------- balance (3D flip card) ---------- */
.balance-wrap{position:relative; overflow:hidden; border-radius:var(--radius); margin-bottom:16px; box-shadow:var(--shadow-lg); perspective:900px;}
.balance-flip{position:relative; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.4,0,.2,1);}
.balance-wrap.hidden .balance-flip{transform:rotateY(180deg);}
.balance{
  background:var(--green); color:#f7f3ea; border-radius:var(--radius);
  padding:18px 18px 16px; cursor:pointer;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  transition:background-color .45s ease;
}
[data-theme="dark"] .balance{background:#234d2f; color:#eef4ea;}
.balance .top{display:flex; justify-content:space-between; align-items:center;}
.balance .lbl{font-size:13px; opacity:.85;}
.balance .eye, .balance-cover .eye{width:34px; height:34px; border-radius:50%; border:1px solid rgba(247,243,234,.35); background:transparent; color:#f7f3ea; display:inline-flex; align-items:center; justify-content:center;}
.balance .eye svg, .balance-cover .eye svg{width:19px; height:19px;}
.balance .amt{font-size:36px; font-weight:700; line-height:1.15; margin-top:2px;}
.balance .sub{font-size:13px; opacity:.85; margin-top:6px; line-height:1.5;}
.balance-cover{
  position:absolute; inset:0; border-radius:var(--radius); overflow:hidden;
  transform:rotateY(180deg); cursor:pointer;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
}
.balance-cover img{width:100%; height:100%; object-fit:cover; display:block;}
.balance-cover .eye{position:absolute; top:12px; right:12px; background:rgba(20,18,12,.55); border-color:rgba(247,243,234,.45);}
/* ---------- budget bar ---------- */
@keyframes barIn{from{width:0;}}
.budgetbar{height:12px; background:var(--chip-bg); border-radius:99px; overflow:hidden;}
.budgetbar .fill{height:100%; background:var(--green-fill); border-radius:99px; animation:barIn .8s ease both;}
.budgetbar .fill.over{background:var(--danger);}
.budgetrow{display:flex; justify-content:space-between; font-size:13.5px; color:var(--ink-soft); margin-top:8px;}
.budgetrow b{color:var(--ink);}
.statgrid{display:flex; gap:10px; margin-top:14px;}
.stat{flex:1; background:var(--green-soft); border-radius:10px; padding:10px 12px; box-shadow:var(--shadow); transition:background-color .45s ease, box-shadow .2s ease, transform .18s ease;}
.stat:active{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
.stat .v{font-size:17px; font-weight:700; color:var(--green-ink);}
.stat .k{font-size:12px; color:var(--ink-soft);}
.stat .s{font-size:12px; color:var(--ink-soft); margin-top:2px;}
/* ---------- donut ---------- */
@keyframes donutIn{from{opacity:0; transform:rotate(-30deg) scale(.94);} to{opacity:1; transform:rotate(0) scale(1);}}
.donut-wrap{display:flex; gap:16px; align-items:center;}
.donut{animation:donutIn .7s ease both; flex-shrink:0;}
.legend{flex:1; min-width:0;}
.legend .row{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13.5px;}
.legend .dot{width:10px; height:10px; border-radius:3px; flex-shrink:0;}
.legend .nm{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.legend .am{font-weight:700;}
.legend .pc{color:var(--ink-soft); font-size:12px; width:34px; text-align:right;}
.empty{color:var(--ink-soft); font-size:14px; text-align:center; padding:14px 0;}
/* ---------- bars ---------- */
@keyframes barGrow{from{transform:scaleY(0);} to{transform:scaleY(1);}}
.bar-chart{display:flex; align-items:flex-end; gap:8px; height:120px; padding-top:6px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
.bar-col .bar{width:100%; max-width:34px; background:var(--green-fill); border-radius:6px 6px 3px 3px; opacity:.75; transform-origin:bottom; animation:barGrow .6s ease both;}
.bar-col.today .bar{opacity:1; background:var(--green);}
.bar-col .bv{font-size:11px; color:var(--ink-soft); line-height:1;}
.bar-col .bl{font-size:12px; color:var(--ink-soft);}
.bar-col.today .bl{color:var(--green-ink); font-weight:700;}
/* ---------- activity ---------- */
.actrow{display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--line);}
.actrow:last-child{border-bottom:none;}
.catic{width:38px; height:38px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
.catic svg{width:20px; height:20px;}
.actrow .mid{flex:1; min-width:0;}
.actrow .nm{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.actrow .dt{font-size:12px; color:var(--ink-soft);}
.actrow .am{font-weight:700; font-size:15px; white-space:nowrap;}
.actrow .am.inc{color:var(--green-fill);}
/* ---------- day view / ledger ---------- */
.datenav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px;}
.datenav .d{text-align:center; flex:1;}
.datenav .d .date{font-size:19px; font-weight:700;}
.datenav .d .wd{font-size:13px; color:var(--ink-soft);}
.arrow{width:42px; height:42px; font-size:22px; border:1px solid var(--line-strong); background:var(--card); color:var(--ink); border-radius:12px; box-shadow:var(--shadow); flex-shrink:0;}
.search{position:relative; margin-bottom:14px;}
.search input{
  width:100%; padding:11px 13px; font-size:15px; font-family:inherit; color:var(--ink);
  background:var(--input-bg); border:1px solid var(--line-strong); border-radius:12px; outline:none;
  transition:background-color .45s ease, color .45s ease, border-color .2s ease;
}
.search input:focus{border-color:var(--green);}
.suggest{
  position:absolute; left:0; right:0; top:100%; z-index:20; background:var(--card);
  border:1px solid var(--line-strong); border-top:none; border-radius:0 0 12px 12px; box-shadow:var(--shadow);
}
.suggest button{display:block; width:100%; text-align:left; background:none; border:none; border-top:1px solid var(--line); padding:11px 13px; font-size:15px; color:var(--ink);}
.suggest button:first-child{border-top:none;}
.suggest button:active{background:var(--green-soft);}
.suggest .none{padding:11px 13px; font-size:14px; color:var(--ink-soft);}
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  display:inline-flex; align-items:center; gap:7px; flex-shrink:0;
  border:1px solid var(--line-strong); background:var(--card); color:var(--ink);
  border-radius:99px; padding:8px 13px 8px 9px; font-size:14px; box-shadow:var(--shadow);
}
.chip .catic{width:26px; height:26px; border-radius:50%;}
.chip .catic svg{width:15px; height:15px;}
table.ledger{width:100%; border-collapse:collapse;}
table.ledger td{padding:11px 0; border-bottom:1px solid var(--line); vertical-align:middle;}
table.ledger tr:last-child td{border-bottom:none;}
table.ledger .ic{width:46px;}
table.ledger .nm{font-size:14.5px; font-weight:700; line-height:1.3;}
table.ledger .nt{font-size:12.5px; color:var(--ink-soft); line-height:1.3;}
table.ledger .am{width:118px; text-align:right;}
table.ledger .am input{
  width:100%; text-align:right; font-size:16px; font-weight:700; font-family:inherit; color:var(--ink);
  background:var(--input-bg); border:1px solid var(--line); border-radius:8px; padding:7px 9px; outline:none;
  transition:background-color .45s ease, color .45s ease, border-color .2s ease;
}
table.ledger .am input:focus{border-color:var(--green);}
table.ledger .am input.inc{color:var(--green-fill);}
table.ledger .del{width:34px; text-align:right;}
table.ledger .del button{border:none; background:none; color:var(--ink-soft); font-size:19px; padding:4px 2px;}
table.ledger .note-in{
  width:100%; font-size:13.5px; font-family:inherit; color:var(--ink);
  background:transparent; border:none; border-bottom:1px dashed var(--line-strong); padding:2px 0; outline:none;
}
.totalbar{border-top:2px solid var(--green); margin-top:6px; padding-top:12px;}
.totalbar .row{display:flex; justify-content:space-between; font-size:15px; padding:3px 0;}
.totalbar .row.big{font-size:18px; font-weight:700; color:var(--green-ink);}
.totalbar .row .rem{color:var(--green-fill); font-weight:700;}
/* ---------- setup ---------- */
.setup-hero{margin:6px 0 18px; border-radius:18px; overflow:hidden; box-shadow:var(--shadow-lg);}
.setup-hero img{width:100%; height:170px; object-fit:cover; display:block;}
.setup-hero .cap{padding:14px 16px; background:var(--green); color:#f7f3ea;}
.setup-hero .cap .t{font-size:20px; font-weight:700;}
.setup-hero .cap .s{font-size:13px; opacity:.85;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13.5px; color:var(--ink-soft); margin-bottom:6px;}
.field input{
  width:100%; padding:12px 13px; font-size:17px; font-family:inherit; color:var(--ink);
  background:var(--input-bg); border:1px solid var(--line-strong); border-radius:12px; outline:none;
  transition:background-color .45s ease, color .45s ease, border-color .2s ease;
}
.field input:focus{border-color:var(--green);}
.suggest-chip{
  display:inline-block; margin-top:8px; border:1px dashed var(--green); color:var(--green-ink);
  background:var(--green-soft); border-radius:99px; padding:6px 12px; font-size:13.5px;
}
/* ---------- settings ---------- */
.setrow{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:14px; transition:background-color .45s ease;}
.hint{font-size:13.5px; color:var(--ink-soft); line-height:1.55;}
/* ---------- budget explainer + first-run tour ---------- */
.whyrow{text-align:right; margin-top:2px;}
.whylink{background:none; border:none; padding:2px 0; font-size:12.5px; color:var(--green); text-decoration:underline; cursor:pointer; font-family:inherit;}
.whybox{background:var(--chip-bg); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.6; color:var(--ink-soft); margin-top:6px;}
.tour-overlay{position:fixed; inset:0; background:rgba(20,16,10,.55); z-index:90;}
.tour-ring{position:fixed; display:none; border:2.5px solid #fff; border-radius:50%; box-shadow:0 0 0 4px rgba(255,255,255,.22); animation:tourPulse 1.3s ease-out infinite; pointer-events:none;}
.tour-ring.rect{border-radius:14px;}
.tour-tip{position:fixed; left:20px; right:20px; top:110px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:16px; animation:fadeUp .3s ease both;}
.tour-tip:before{content:''; position:absolute; left:36px; top:-8px; width:14px; height:14px; background:var(--card); border-left:1px solid var(--line); border-top:1px solid var(--line); transform:rotate(45deg);}
.tour-txt{font-size:16px; font-weight:700; color:var(--ink); line-height:1.45;}
.tour-btns{display:flex; gap:10px; margin-top:14px;}
.tour-btns .btn{flex:1; text-align:center;}
@keyframes tourPulse{0%{box-shadow:0 0 0 4px rgba(255,255,255,.35);}100%{box-shadow:0 0 0 16px rgba(255,255,255,0);}}
/* ---------- setup agreement + policy modal ---------- */
.agree-row{display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; padding:10px 2px; text-align:left; font-family:inherit;}
.agree-check{width:24px; height:24px; border-radius:7px; border:2px solid var(--line-strong); background:var(--card); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; color:#f7f3ea;}
.agree-check.on{background:var(--green); border-color:var(--green);}
.agree-check svg{width:15px; height:15px;}
.agree-txt{font-size:14.5px; color:var(--ink); line-height:1.4;}
.policyrow{text-align:center; margin:2px 0 14px;}
.policylink{background:none; border:none; padding:2px 0; font-size:13.5px; color:var(--green); text-decoration:underline; cursor:pointer; font-family:inherit;}
.modal-overlay{position:fixed; inset:0; background:rgba(20,16,10,.55); z-index:95; display:flex; align-items:center; justify-content:center; padding:24px;}
.modal-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:20px; max-width:420px; width:100%; max-height:80vh; display:flex; flex-direction:column; animation:fadeUp .3s ease both;}
.modal-card h3{margin:0 0 12px; font-size:17px; color:var(--green-ink);}
.modal-body{font-size:14px; line-height:1.7; color:var(--ink-soft); white-space:pre-line; overflow-y:auto; margin-bottom:16px;}
.dateline{text-align:center; font-size:13px; color:var(--ink-soft); margin:0 0 12px;}
.setrow h3{margin:0 0 10px; font-size:15px; color:var(--green-ink);}
.seg{display:flex; gap:8px;}
.seg .btn.on{background:var(--green); border-color:var(--green); color:#f7f3ea; font-weight:700;}
[data-theme="dark"] .seg .btn.on{color:#14210f;}
.setrow .rowbtns{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.foot{text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:18px;}
.toast{
  position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(12px);
  background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:99px;
  font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50;
  max-width:90%; text-align:center; box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
/* ---------- tab bar + FAB ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--card); border-top:1px solid var(--line);
  display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 14px rgba(38,34,26,.06);
  transition:background-color .45s ease, border-color .45s ease;
}
.tabbar .tab{
  flex:1; border:none; background:none; color:var(--ink-soft);
  display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0 2px; font-size:12px;
}
.tabbar .tab svg{width:22px; height:22px;}
.tabbar .tab.on{color:var(--clay); font-weight:700;}
.fab{
  position:fixed; right:18px; bottom:calc(82px + env(safe-area-inset-bottom)); z-index:41;
  width:56px; height:56px; border-radius:50%; border:none; background:var(--clay); color:#f7f3ea;
  font-size:30px; line-height:1; box-shadow:var(--shadow-lg);
  display:flex; align-items:center; justify-content:center;
}
[data-theme="dark"] .fab{color:#14210f;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* Sir Khant Finance — PUBLIC version (PWA + Android).
   Local-first: all data stays on the user's phone (localStorage).
   No accounts, no cloud sync, no personal data baked in.
   Rename the app by changing APP_NAME here and in manifest.json. */
var APP_NAME = 'Sir Khant Finance';
var APP_VERSION = '1.0.8';
var STORE_KEY = 'skf_public_v1';
var MIN_ISO = '2020-01-01';
var MAX_ISO = '2035-12-31';

/* ---------------- date helpers (pure) ---------------- */
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function toISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function fromISO(iso){
  var p = String(iso).split('-');
  if (p.length !== 3) return null;
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  if (d.getFullYear() !== +p[0] || d.getMonth() !== +p[1] - 1 || d.getDate() !== +p[2]) return null;
  return d;
}
function isoAdd(iso, n){ var d = fromISO(iso); if (!d) return iso; d.setDate(d.getDate() + n); return toISO(d); }
function clampISO(iso){ if (iso < MIN_ISO) return MIN_ISO; if (iso > MAX_ISO) return MAX_ISO; return iso; }
var _todayOverride = null;
function todayISO(){ if (_todayOverride) return _todayOverride; return toISO(new Date()); }
function isToday(iso){ return iso === todayISO(); }
function daysInMonth(y, m){ return new Date(y, m, 0).getDate(); }
function monthKeyOf(iso){ return String(iso).slice(0, 7); }
function monthLabel(key){
  var p = key.split('-');
  var y = +p[0], m = +p[1];
  if (state.settings.lang === 'my') return MONTHS_MY[m - 1] + ' ' + y;
  return MONTHS_FULL_EN[m - 1] + ' ' + y;
}
function formatDateLong(iso){
  var d = fromISO(iso);
  if (!d) return iso;
  if (state.settings.lang === 'my')
    return d.getDate() + ' ' + MONTHS_MY[d.getMonth()] + ' ' + d.getFullYear();
  return MONTHS_EN[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}
function formatDateShort(iso){
  var d = fromISO(iso);
  if (!d) return iso;
  if (state.settings.lang === 'my')
    return d.getDate() + ' ' + MONTHS_MY[d.getMonth()];
  return MONTHS_EN[d.getMonth()] + ' ' + d.getDate();
}
function weekdayName(iso){
  var d = fromISO(iso);
  if (!d) return '';
  return (state.settings.lang === 'my' ? WD_MY : WD_EN)[d.getDay()];
}
var MY_DIGITS = {'၀':'0','၁':'1','၂':'2','၃':'3','၄':'4','၅':'5','၆':'6','၇':'7','၈':'8','၉':'9'};
function normDigits(s){ return String(s).replace(/[၀-၉]/g, function(c){ return MY_DIGITS[c]; }); }
function monthNameToNum(s){
  s = s.toLowerCase();
  for (var i = 0; i < 12; i++){
    if (MONTHS_EN[i].toLowerCase() === s || MONTHS_FULL_EN[i].toLowerCase() === s) return i + 1;
    if (MONTHS_MY[i] === s) return i + 1;
  }
  return 0;
}
function validDate(y, m, d){
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  var dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  var iso = toISO(dt);
  if (iso < MIN_ISO || iso > MAX_ISO) return null;
  return iso;
}
function parseDateInput(raw){
  var q = normDigits(String(raw || '')).trim().toLowerCase().replace(/,/g, ' ').replace(/\s+/g, ' ');
  if (!q) return null;
  var m;
  m = q.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return validDate(+m[1], +m[2], +m[3]);
  m = q.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
  if (m) return validDate(+m[3], +m[2], +m[1]);
  m = q.match(/^(\d{1,2})[-/.](\d{1,2})$/);
  if (m){
    var y = new Date().getFullYear();
    var r = validDate(y, +m[2], +m[1]);
    if (r) return r;
    return validDate(y + 1, +m[2], +m[1]);
  }
  m = q.match(/^([a-z\u1000-\u109f]+) (\d{1,2})(?: (\d{4}))?$/);
  if (m){
    var mo = monthNameToNum(m[1]);
    if (mo) return validDate(m[3] ? +m[3] : new Date().getFullYear(), mo, +m[2]);
  }
  m = q.match(/^(\d{1,2}) ([a-z\u1000-\u109f]+)(?: (\d{4}))?$/);
  if (m){
    var mo2 = monthNameToNum(m[2]);
    if (mo2) return validDate(m[3] ? +m[3] : new Date().getFullYear(), mo2, +m[1]);
  }
  return null;
}
/* When a date input matches a date pattern but the day does not exist in
   that month (e.g. 32/11), returns {month, maxDay, day} so the UI can say
   which day the month ends on. Returns null otherwise. */
function dateInputError(raw){
  var q = normDigits(String(raw || '')).trim().toLowerCase().replace(/,/g, ' ').replace(/\s+/g, ' ');
  if (!q) return null;
  var y = new Date().getFullYear(), m = 0, d = 0, mm;
  mm = q.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (mm){ y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = q.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))){ d = +mm[1]; m = +mm[2]; y = +mm[3]; }
  else if ((mm = q.match(/^(\d{1,2})[-/.](\d{1,2})$/))){ d = +mm[1]; m = +mm[2]; }
  else if ((mm = q.match(/^([a-z\u1000-\u109f]+) (\d{1,2})(?: (\d{4}))?$/))){ m = monthNameToNum(mm[1]); d = +mm[2]; if (mm[3]) y = +mm[3]; }
  else if ((mm = q.match(/^(\d{1,2}) ([a-z\u1000-\u109f]+)(?: (\d{4}))?$/))){ d = +mm[1]; m = monthNameToNum(mm[2]); if (mm[3]) y = +mm[3]; }
  else return null;
  if (!m || m < 1 || m > 12) return null;
  if (d < 1) return null;
  var max = daysInMonth(y, m);
  if (d <= max) return null;
  return { month: m, maxDay: max, day: d };
}
function dateSuggestions(raw){
  var exact = parseDateInput(raw);
  var out = [];
  if (exact) out.push(exact);
  var q = normDigits(String(raw || '')).trim().toLowerCase();
  if (!q) return out;
  var cur = todayISO();
  for (var i = 0; i < 370 && out.length < 8; i++){
    var iso = isoAdd(cur, i - 180);
    if (iso < MIN_ISO || iso > MAX_ISO) continue;
    if (out.indexOf(iso) !== -1) continue;
    var hay = (formatDateLong(iso) + ' ' + iso).toLowerCase();
    if (hay.indexOf(q) !== -1) out.push(iso);
  }
  return out;
}

function dayExpense(day){

function monthTotals(key){

    if (monthKeyOf(iso) !== key) continue;

function last7(){

function recentActivity(n){
  var all = [];

/* Days from today until the next payday (paydayDay = day of month). */
/* Next payday as an ISO date. A payday day that does not exist in a month
   (e.g. the 31st in November) is clamped to that month's last day. */
function nextPaydayISO(paydayDay, today){
  var t = fromISO(today || todayISO());
  var y = t.getFullYear(), m = t.getMonth() + 1, day = t.getDate();
  var pd = Math.max(1, Math.min(31, Math.round(paydayDay) || 1));
  var thisMonth = new Date(y, m - 1, Math.min(pd, daysInMonth(y, m)));
  if (day < thisMonth.getDate()) return toISO(thisMonth);
  var ny = m === 12 ? y + 1 : y, nm = m === 12 ? 1 : m + 1;
  return toISO(new Date(ny, nm - 1, Math.min(pd, daysInMonth(ny, nm))));
}
function daysUntilPayday(paydayDay, today){
  var t = fromISO(today || todayISO());
  var next = fromISO(nextPaydayISO(paydayDay, today));
  var ms = next.getTime() - new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
  return Math.max(0, Math.round(ms / 86400000));
}
function suggestTarget(balance, paydayDay, today){
  var days = daysUntilPayday(paydayDay, today);
  return Math.round((Number(balance) || 0) / Math.max(1, days));
}
/* English ordinal: 28th, 29th, 30th, 31st. */
function ord(n){ var s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
/* Payday must exist in the CURRENT month: November has 30 days, February
   28 (29 in a leap year). Returns the error message, or '' when valid. */
function paydayMonthError(pd){
  var dt = fromISO(todayISO());
  var max = daysInMonth(dt.getFullYear(), dt.getMonth() + 1);
  if (pd >= 1 && pd <= max) return '';
  var mn = state.settings.lang === 'my' ? MONTHS_MY[dt.getMonth()] : MONTHS_FULL_EN[dt.getMonth()];
  return t('paydayMonth').split('{m}').join(mn).split('{x}').join(String(max));
}
/* "Today, 15 November 2026 · November ends on the 30th" — shown on home
   and on setup so the current date and month length are visible at a
   glance, before the user types a payday. */
function todayLine(){
  var dt = fromISO(todayISO());
  var d = dt.getDate(), y = dt.getFullYear(), mi = dt.getMonth();
  var mn = state.settings.lang === 'my' ? MONTHS_MY[mi] : MONTHS_FULL_EN[mi];
  var max = daysInMonth(y, mi + 1);
  var left = t('todayIs').split('{d}').join(String(d)).split('{m}').join(mn).split('{y}').join(String(y));
  var right = t('monthEnds').split('{m}').join(mn).split('{x}').join(state.settings.lang === 'my' ? String(max) : ord(max));
  return left + ' · ' + right;
}

/* ---------------- chart data (pure) ---------------- */
var DONUT_R = 34;
var DONUT_C = 2 * Math.PI * DONUT_R;
function donutSegments(byCat){
  var total = 0;
  for (var c in byCat) total += byCat[c];
  if (total <= 0) return [];
  var segs = [], offset = 0;
  CATS.forEach(function(cat){
    var amt = byCat[cat.id] || 0;
    if (amt <= 0) return;
    var frac = amt / total;
    segs.push({
      cat: cat.id, amount: amt, pct: Math.round(frac * 100),
      color: cat.color, dash: (frac * DONUT_C).toFixed(1),
      offset: (-offset * DONUT_C).toFixed(1)
    });
    offset += frac;
  });
  return segs;
}

function importState(text){

  if (!s || typeof s !== 'object' || !s.setup || typeof s.setup !== 'object' ||
      !s.days || typeof s.days !== 'object') return { ok:false, error:'shape' };

    if (d.income !== undefined && !Array.isArray(d.income)) return { ok:false, error:'income' };

  if (typeof s.setup.paydayDay === 'number') next.setup.paydayDay = s.setup.paydayDay;
  if (typeof s.setup.dailyTarget === 'number') next.setup.dailyTarget = s.setup.dailyTarget;
  next.setup.done = s.setup.done === true;

  if (s.settings && typeof s.settings === 'object'){
    if (s.settings.theme === 'dark' || s.settings.theme === 'light') next.settings.theme = s.settings.theme;
    if (s.settings.lang === 'my' || s.settings.lang === 'en') next.settings.lang = s.settings.lang;

  if (s.profile && typeof s.profile === 'object'){
    if (typeof s.profile.name === 'string') next.profile.name = s.profile.name.slice(0, 24);
    if (typeof s.profile.photo === 'string') next.profile.photo = s.profile.photo;

}

/* Animated count-up for dashboard numbers (no-op without a real DOM). */
function animateCountUps(){
  if (typeof document === 'undefined' || !document.querySelectorAll) return;
  var nodes = document.querySelectorAll('[data-countup]');
  for (var i = 0; i < nodes.length; i++){
    (function(node){
      var target = Number(node.getAttribute('data-countup')) || 0;
      if (typeof requestAnimationFrame === 'undefined'){ node.textContent = fmt(target); return; }
      var start = null, dur = 600;
      node.textContent = '0';
      function step(ts){
        if (!start) start = ts;
        var p = Math.min(1, (ts - start) / dur);
        var eased = 1 - Math.pow(1 - p, 3);
        node.textContent = fmt(Math.round(target * eased));
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })(nodes[i]);
  }
}

/* ---------------- render + navigation ---------------- */
function render(){
  applyTheme();
  var root = el('app');
  if (!root) return;
  /* Preserve the category chips' horizontal scroll position across the
     re-render, so tapping a chip does not snap the row back to the start. */
  var chipScroll = 0;
  var cr0 = el('chipRow');
  if (cr0 && typeof cr0.scrollLeft === 'number') chipScroll = cr0.scrollLeft;
  var key = view.name + '|' + (view.iso || '');
  /* First-run tour: start it the first time a finished setup lands on home. */
  if (view.name === 'home' && state.setup.done && !(state.settings && state.settings.tourDone) && tourStep === null) tourStep = 0;
  var html;
  if (!state.setup.done) html = setupViewHTML();
  else if (view.name === 'home') html = homeViewHTML();
  else if (view.name === 'settings') html = settingsViewHTML();
  else html = dayViewHTML();
  html += tabbarHTML();
  if (tourStep !== null && view.name === 'home' && state.setup.done) html += tourHTML();
  if (policyOpen) html += policyModalHTML();
  root.innerHTML = html;
  /* New view: start at the top of the page. Without this, tapping Start
     low on the long setup form leaves home scrolled down, so the tour
     ring lands off-screen above the profile header. */
  if (key !== lastViewKey && typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
  positionTour();
  var cr1 = el('chipRow');
  if (cr1 && typeof cr1.scrollLeft === 'number') cr1.scrollLeft = chipScroll;
  if (editingName){
    var ni = el('nameInput');
    if (ni && ni.focus){ ni.focus(); if (ni.select) ni.select(); }
  }
  if (key !== lastViewKey){
    lastViewKey = key;
    if (root.classList){
      root.classList.remove('view-enter');
      void root.offsetWidth;
      root.classList.add('view-enter');
    }
  }
  if (view.name === 'home' && state.setup.done) animateCountUps();
}
function setHash(hash, push){
  if (typeof window === 'undefined' || !window.history) return;
  try {
    if (push) window.history.pushState(null, '', hash);
    else window.history.replaceState(null, '', hash);
  } catch (e) {}
}
function goHome(push){
  dayDirty = false;
  view = { name:'home', iso: clampISO(todayISO()) };
  setHash('#home', push !== false);
  render();
}
function goToDay(iso, push){
  dayDirty = false;
  view = { name:'day', iso: clampISO(iso) };
  setHash('#day=' + view.iso, push !== false);
  render();
}
function goToSettings(push){
  dayDirty = false;
  view = { name:'settings', iso: view.iso };
  setHash('#settings', push !== false);
  render();
}
function onHashChange(){
  dayDirty = false;
  var hash = (typeof window !== 'undefined' && window.location) ? window.location.hash : '';
  if (hash === '#settings') view = { name:'settings', iso: view.iso };
  else if (hash === '#home') view = { name:'home', iso: clampISO(todayISO()) };
  else {
    var m = hash.match(/^#day=(\d{4}-\d{2}-\d{2})$/);
    view = { name:'day', iso: m ? clampISO(m[1]) : clampISO(todayISO()) };
  }
  render();
}
function focusAmount(kind, idx){
  if (typeof document === 'undefined' || !document.querySelector) return;
  var inp = document.querySelector('input[' + kind + '="' + idx + '"]');
  if (inp) inp.focus();
}
/* Full re-render that keeps focus in the amount field being typed in. */
function updateTotalsOnly(){
  if (typeof document === 'undefined') return;
  var root = el('app');
  if (!root) return;
  var active = document.activeElement;
  var key = null, kind = null;
  if (active && active.getAttribute){
    if (active.getAttribute('data-entry-amount') !== null){ key = active.getAttribute('data-entry-amount'); kind = 'data-entry-amount'; }
    else if (active.getAttribute('data-income-amount') !== null){ key = active.getAttribute('data-income-amount'); kind = 'data-income-amount'; }
  }
  render();
  if (key !== null && kind && root.querySelector){
    var inputs = root.querySelectorAll('input[' + kind + '="' + key + '"]');
    if (inputs && inputs.length){
      inputs[0].focus();
      var v = inputs[0].value; inputs[0].value = ''; inputs[0].value = v;
    }
  }
}

/* ---------------- events ---------------- */
function handleClick(e){
  var target = e.target;
  while (target && target !== document.body && !(target.getAttribute && target.getAttribute('data-action'))) target = target.parentNode;
  if (!target || !target.getAttribute) return;
  var action = target.getAttribute('data-action');
  var iso = view.iso;
  switch (action){
    case 'tab-home': goHome(true); break;
    case 'tab-day': goToDay(todayISO(), true); break;
    case 'tab-settings': goToSettings(true); break;
    case 'fab-add': goToDay(todayISO(), true); break;
    case 'toggle-balance': toggleBalance(); break;
    case 'nav-prev': goToDay(isoAdd(iso, -1), true); break;
    case 'nav-next': goToDay(isoAdd(iso, 1), true); break;
    case 'goto-date': {
      var g = target.getAttribute('data-iso');
      searchText = ''; searchOpen = false;
      goToDay(g, true); break;
    }
    case 'add-cat': {
      var day = getDay(iso);
      day.entries.push({ cat: target.getAttribute('data-cat') || 'other', note:'', amount:0 });
      dayDirty = true;
      persist(); render();
      focusAmount('data-entry-amount', day.entries.length - 1);
      break;
    }
    case 'add-income': {
      var day2 = getDay(iso);
      day2.income.push({ amount:0, note:'' });
      dayDirty = true;
      persist(); render();
      focusAmount('data-income-amount', day2.income.length - 1);
      break;
    }
    case 'del-entry': {
      getDay(iso).entries.splice(+target.getAttribute('data-idx'), 1);
      dayDirty = true;
      persist(); render(); break;
    }
    case 'del-income': {
      getDay(iso).income.splice(+target.getAttribute('data-idx'), 1);
      dayDirty = true;
      persist(); render(); break;
    }
    case 'save-day':
      dayDirty = false;
      persist();
      showToast(t('saved'));
      render();
      break;
    case 'edit-name':
      editingName = true;
      nameDraft = (state.profile && state.profile.name) || '';
      render();
      break;
    case 'save-name': {
      var ni = el('nameInput');
      var nm = (ni ? String(ni.value || '') : nameDraft).trim().slice(0, 24);
      if (!state.profile) state.profile = { name:'', photo:'' };
      state.profile.name = nm;
      editingName = false;
      persist(); render();
      break;
    }
    case 'pick-photo': {
      var pi = el('photoInput');
      if (pi && pi.click) pi.click();
      break;
    }
    case 'toggle-budget-why':
      budgetWhyOpen = !budgetWhyOpen;
      render();
      break;
    case 'tour-now': {
      if (tourStep === 0){
        tourStep = 1;
        render();
        var pi2 = el('photoInput');
        if (pi2 && pi2.click) pi2.click();
      } else {
        tourStep = null;
        if (!state.settings) state.settings = {};
        state.settings.tourDone = true;
        persist();
        editingName = true;
        nameDraft = (state.profile && state.profile.name) || '';
        render();
      }
      break;
    }
    case 'tour-later':
      if (tourStep === 0){ tourStep = 1; render(); }
      else endTour();
      break;
    case 'toggle-agree':
      agreeChecked = !agreeChecked;
      render();
      break;
    case 'open-policy':
      policyOpen = true;
      render();
      break;
    case 'close-policy':
      policyOpen = false;
      render();
      break;
    case 'theme-toggle':
      state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
      persist(); render(); swapView(); break;
    case 'lang-toggle':
      state.settings.lang = state.settings.lang === 'my' ? 'en' : 'my';
      persist(); render(); swapView(); break;
    case 'set-theme':
      state.settings.theme = target.getAttribute('data-theme');
      persist(); render(); swapView(); break;
    case 'set-lang':
      state.settings.lang = target.getAttribute('data-lang');
      persist(); render(); swapView(); break;
    case 'use-suggest': {
      if (!setupDraft) break;
      var sug = suggestTarget(setupDraft.balance, setupDraft.paydayDay);
      if (sug <= 0) break;
      setupDraft.dailyTarget = sug;
      var ti = el('setupTgt');
      if (ti) ti.value = setupDraft.dailyTarget;
      break;
    }
    case 'setup-start': {
      /* All three fields are required (no Skip), and the agreement box
         must be checked. Empty means the input was never filled in —
         a typed 0 counts as filled. */
      var b0 = el('setupBal'), p0 = el('setupPay'), t0 = el('setupTgt');
      var bEmpty = !b0 || String(b0.value || '').trim() === '';
      var pEmpty = !p0 || String(p0.value || '').trim() === '';
      var tEmpty = !t0 || String(t0.value || '').trim() === '';
      if (bEmpty || pEmpty || tEmpty){ showToast(t('fillFirst')); break; }
      var s = readSetupInputs();
      var perr = paydayMonthError(s.paydayDay);
      if (perr){ showToast(perr); break; }
      if (!agreeChecked){ showToast(t('agreeFirst')); break; }
      state.setup.balance = s.balance;
      state.setup.paydayDay = s.paydayDay;
      state.setup.dailyTarget = s.dailyTarget;
      state.setup.done = true;
      setupDraft = null;
      agreeChecked = false;
      persist();
      goHome(false);
      break;
    }
    case 'save-setup': {
      var b = el('editBal'), p = el('editPay'), tg = el('editTgt');
      var npd = Math.round(Number(p ? p.value : 1) || 1);
      var perr2 = paydayMonthError(npd);
      if (perr2){ showToast(perr2); break; }
      state.setup.balance = Math.max(0, Math.round(Number(b ? b.value : 0) || 0));
      state.setup.paydayDay = npd;
      state.setup.dailyTarget = Math.max(0, Math.round(Number(tg ? tg.value : 0) || 0));
      persist();
      showToast(t('saved'));
      render();
      break;
    }
    case 'export-backup':
      exportBackup();
      break;
    case 'import-pick': {
      var fi = el('importFile');
      if (fi && fi.click) fi.click();
      break;
    }
    case 'reset-data': {
      if (!resetArmed){
        resetArmed = true;
        render();
        if (resetTimer) clearTimeout(resetTimer);
        resetTimer = setTimeout(function(){ resetArmed = false; }, 5000);
      } else {
        if (resetTimer) clearTimeout(resetTimer);
        resetArmed = false;
        state = defaultState();
        setupDraft = null;
        dayDirty = false;
        editingName = false;
        tourStep = null;
        budgetWhyOpen = false;
        agreeChecked = false;
        policyOpen = false;
        persist();
        view = { name:'setup', iso: clampISO(todayISO()) };
        showToast(t('resetDone'));
        render();
      }
      break;
    }
  }
}
/* Backup export: a real file, never raw text on screen.
   APK: the native shell (AndroidBridge) writes it into Downloads.
   Browser/PWA: a normal file download. Last resort: clipboard copy. */
function exportBackup(){
  var json = exportState();
  if (typeof window !== 'undefined' && window.AndroidBridge && window.AndroidBridge.saveBackup){
    try { window.AndroidBridge.saveBackup(json); showToast(t('backupSaved')); return; } catch (e) {}
  }
  if (typeof document !== 'undefined' && typeof Blob !== 'undefined' &&
      typeof URL !== 'undefined' && URL.createObjectURL){
    try {
      var blob = new Blob([json], { type:'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'sir-khant-finance-backup.json';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      showToast(t('backupSaved'));
      return;
    } catch (err) {}
  }
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(function(){ showToast(t('backupSaved')); },
      function(){ showToast(t('importFail')); });
  } else { showToast(t('importFail')); }
}
/* Downscale a picked photo to max 256px (JPEG) so the profile picture
   stays small in localStorage. Calls done(dataUrl) or done(null). */
function downscalePhoto(dataUrl, done){
  if (typeof Image === 'undefined' || typeof document === 'undefined' || !document.createElement){ done(dataUrl); return; }
  var img = new Image();
  img.onload = function(){
    try {
      var max = 256, w = img.width, h = img.height;
      if (!w || !h || (w <= max && h <= max)){ done(dataUrl); return; }
      var s = Math.min(max / w, max / h);
      var cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w * s));
      cv.height = Math.max(1, Math.round(h * s));
      var ctx = cv.getContext ? cv.getContext('2d') : null;
      if (!ctx){ done(dataUrl); return; }
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      done(cv.toDataURL('image/jpeg', 0.8));
    } catch (e){ done(dataUrl); }
  };
  img.onerror = function(){ done(null); };
  img.src = dataUrl;
}
function handleChange(e){
  var target = e.target;
  if (!target || !target.files) return;
  if (target.id === 'photoInput'){
    var f = target.files[0];
    if (!f) return;
    if (typeof FileReader === 'undefined'){ showToast(t('photoFail')); return; }
    var rd = new FileReader();
    rd.onload = function(){
      downscalePhoto(String(rd.result || ''), function(url){
        if (!url){ showToast(t('photoFail')); return; }
        if (!state.profile) state.profile = { name:'', photo:'' };
        state.profile.photo = url;
        persist(); render();
      });
    };
    rd.onerror = function(){ showToast(t('photoFail')); };
    rd.readAsDataURL(f);
    return;
  }
  if (target.id === 'importFile'){
    var bf = target.files[0];
    if (!bf) return;
    if (typeof FileReader === 'undefined'){ showToast(t('importFail')); return; }
    var brd = new FileReader();
    brd.onload = function(){
      var r = importState(String(brd.result || ''));
      showToast(r.ok ? t('importDone') : t('importFail'));
      if (r.ok){ setupDraft = null; dayDirty = false; goHome(false); }
    };
    brd.onerror = function(){ showToast(t('importFail')); };
    brd.readAsText(bf);
  }
}
function handleKeyDown(e){
  if (!e || !e.target) return;
  if (e.key === 'Enter' && e.target.id === 'nameInput'){
    var ni = el('nameInput');
    var nm = (ni ? String(ni.value || '') : nameDraft).trim().slice(0, 24);
    if (!state.profile) state.profile = { name:'', photo:'' };
    state.profile.name = nm;
    editingName = false;
    persist(); render();
  }
}
function updateSuggestChip(){
  var chip = el('suggestChip');
  if (!chip || !setupDraft) return;
  var sug = suggestTarget(setupDraft.balance, setupDraft.paydayDay);
  chip.textContent = t('suggestTarget') + ': ' + fmt(sug) + ' ' + t('kyat') + t('perDay');
}
function handleInput(e){
  var target = e.target;
  if (!target || !target.getAttribute) return;
  var iso = view.iso;
  var day = getDay(iso);
  if (target.id === 'searchInput'){
    searchText = target.value;
    searchOpen = true;
    /* Impossible day (e.g. 32/11): alert which day the month ends on.
       Deduped so typing does not spam the same toast. */
    var derr = dateInputError(target.value);
    var dkey = derr ? (derr.month + '/' + derr.maxDay) : '';
    if (derr && dkey !== lastDateErrKey){
      lastDateErrKey = dkey;
      var mn = state.settings.lang === 'my' ? MONTHS_MY[derr.month - 1] : MONTHS_FULL_EN[derr.month - 1];
      showToast(t('monthDays').replace('{m}', mn).replace('{x}', String(derr.maxDay)));
    } else if (!derr) lastDateErrKey = '';
    render();
    var si = el('searchInput');
    if (si){ si.focus(); var v = si.value; si.value = ''; si.value = v; }
    return;
  }
  if (target.id === 'setupBal' || target.id === 'setupPay' || target.id === 'setupTgt'){
    if (!setupDraft) setupDraft = { balance:'', paydayDay:1, dailyTarget:'' };
    if (target.id === 'setupBal') setupDraft.balance = target.value;
    if (target.id === 'setupPay') setupDraft.paydayDay = target.value;
    if (target.id === 'setupTgt') setupDraft.dailyTarget = target.value;
    updateSuggestChip();
    return;
  }
  if (target.id === 'nameInput'){
    nameDraft = target.value;
    return;
  }
  var ea = target.getAttribute('data-entry-amount');
  if (ea !== null){
    day.entries[+ea].amount = Math.max(0, Math.round(Number(target.value) || 0));
    dayDirty = true;
    persist(); updateTotalsOnly(); return;
  }
  var en = target.getAttribute('data-entry-note');
  if (en !== null){
    day.entries[+en].note = target.value;
    dayDirty = true;
    persist(); return;
  }
  var ia = target.getAttribute('data-income-amount');
  if (ia !== null){
    day.income[+ia].amount = Math.max(0, Math.round(Number(target.value) || 0));
    dayDirty = true;
    persist(); updateTotalsOnly(); return;
  }
  var inn = target.getAttribute('data-income-note');
  if (inn !== null){
    day.income[+inn].note = target.value;
    dayDirty = true;
    persist(); return;
  }
}

/* ---------------- init ---------------- */
function init(){
  loadState();
  if (!state.setup.done){
    view = { name:'setup', iso: clampISO(todayISO()) };
  } else if (typeof window !== 'undefined' && window.location && window.location.hash){
    var hash = window.location.hash;
    if (hash === '#settings'){ view = { name:'settings', iso: clampISO(todayISO()) }; }
    else if (hash === '#home'){ view = { name:'home', iso: clampISO(todayISO()) }; }
    else {
      var m = hash.match(/^#day=(\d{4}-\d{2}-\d{2})$/);
      view = { name:'day', iso: m ? clampISO(m[1]) : clampISO(todayISO()) };
    }
  } else {
    view = { name:'home', iso: clampISO(todayISO()) };
  }
  setHash(view.name === 'settings' ? '#settings' : view.name === 'home' ? '#home' : '#day=' + view.iso, false);
  render();
  if (typeof document !== 'undefined'){
    document.addEventListener('click', handleClick);
    document.addEventListener('input', handleInput);
    document.addEventListener('change', handleChange);
    document.addEventListener('keydown', handleKeyDown);
    if (typeof window !== 'undefined') window.addEventListener('hashchange', onHashChange);
  }
  if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator &&
      typeof location !== 'undefined' && location.protocol && location.protocol.indexOf('http') === 0){
    try { navigator.serviceWorker.register('sw.js').catch(function(){}); } catch (e) {}
  }
}
if (typeof document !== 'undefined' && document.readyState !== 'loading') init();
else if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', init);

/* Test seam (Node): expose pure logic + state ops. Harmless in the WebView. */
if (typeof module !== 'undefined' && module.exports){
  module.exports = {
    parseDateInput: parseDateInput, dateInputError: dateInputError, dateSuggestions: dateSuggestions,
    dayExpense: dayExpense, dayIncome: dayIncome, totalsAll: totalsAll,
    remainingAll: remainingAll, monthTotals: monthTotals, monthBudget: monthBudget,
    last7: last7, recentActivity: recentActivity,
    daysUntilPayday: daysUntilPayday, nextPaydayISO: nextPaydayISO, suggestTarget: suggestTarget,
    donutSegments: donutSegments, exportState: exportState, importState: importState,
    getDay: getDay, blankDay: blankDay, hasData: hasData,
    loadState: loadState, persist: persist,
    goHome: goHome, goToDay: goToDay, goToSettings: goToSettings, onHashChange: onHashChange,
    render: render, init: init, handleClick: handleClick, handleInput: handleInput,
    handleChange: handleChange, handleKeyDown: handleKeyDown, exportBackup: exportBackup,
    profileName: profileName, profilePhoto: profilePhoto,
    get dayDirty(){ return dayDirty; },
    get editingName(){ return editingName; },
    get tourStep(){ return tourStep; },
    setTourStep: function(s){ tourStep = s; },
    get budgetWhyOpen(){ return budgetWhyOpen; },
    get agreeChecked(){ return agreeChecked; },
    get policyOpen(){ return policyOpen; },
    budgetWhyText: budgetWhyText, tourHTML: tourHTML, positionTour: positionTour,
    paydayMonthError: paydayMonthError, todayLine: todayLine, ord: ord,
    hideBalance: hideBalance, showBalance: showBalance, toggleBalance: toggleBalance,
    swapView: swapView,
    formatDateLong: formatDateLong, formatDateShort: formatDateShort, monthLabel: monthLabel, daysInMonth: daysInMonth,
    clampISO: clampISO, isoAdd: isoAdd, isToday: isToday, todayISO: todayISO,
    get state(){ return state; }, set state(s){ state = s; },
    get view(){ return view; }, set view(v){ view = v; },
    get balanceHidden(){ return balanceHidden; },
    get setupDraft(){ return setupDraft; }, set setupDraft(v){ setupDraft = v; },
    setToday: function(iso){ _todayOverride = iso; },
    setSearch: function(s, open){ searchText = s; searchOpen = open; },
    CATS: CATS, DONUT_C: DONUT_C, APP_NAME: APP_NAME, APP_VERSION: APP_VERSION
  };
}
